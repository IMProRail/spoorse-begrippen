name: Genereer CSV vanuit Excel

on:
  push:
    branches:
      - main
    paths:
      - 'begrippen-nlsbb.xlsx'

permissions:
  contents: write

jobs:
  generate-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Installeer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Installeer xlsx
        run: npm install xlsx

      - name: Converteer XLSX naar CSV
        run: node .github/workflows/scripts/excel-to-csv.js

      - name: Converteer CSV naar Markdown
        run: node .github/workflows/scripts/csv-to-markdown.js

      - name: Upload resultaat
        uses: actions/upload-artifact@v5
        with:
          name: begrippen-publicatie
          path: |
             begrippen.csv
             begrippen.md

      - name: Commit publicatiebestanden
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      
          git add begrippen.csv begrippen.md
      
          if git diff --cached --quiet; then
            echo "Geen wijzigingen in publicatiebestanden"
          else
            git commit -m "Genereer CSV en Markdown"
            git push
          fi
