name: Genereer CSV vanuit Excel

on:
  push:
    branches:
      - main
    paths:
      - 'begrippen-nlsbb.xlsx'

permissions:
  contents: write

jobs:
  generate-csv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Installeer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Installeer xlsx
        run: npm install xlsx

      - name: Converteer XLSX naar CSV
        run: node .github/workflows/scripts/excel-to-csv.js

      - name: Upload resultaat
        uses: actions/upload-artifact@v5
        with:
          name: begrippen-csv
          path: begrippen.csv

      - name: Commit CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add begrippen.csv

          if git diff --cached --quiet; then
            echo "Geen wijzigingen in begrippen.csv"
          else
            git commit -m "Genereer begrippen.csv"
            git push
          fi
